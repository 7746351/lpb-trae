name: Qt ICU Probe

on:
  repository_dispatch:
    types: [qt-icu-probe]

permissions:
  contents: read

jobs:
  probe:
    name: Probe static Qt ICU linkage
    runs-on: windows-2025-vs2026
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore static Qt cache
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: .tools/qt/6.12.0
          key: qt-${{ runner.os }}-${{ hashFiles('scripts/qt-toolchain.json') }}-static-v2

      - name: Inspect Qt ICU feature
        shell: pwsh
        run: |
          Write-Host "cache-hit=${{ steps.qt-cache.outputs.cache-hit }}"
          Get-ChildItem -Path .tools/qt/6.12.0 -Recurse -Filter 'qtcore-config.h' |
            ForEach-Object {
              Write-Host "== $($_.FullName)"
              Select-String -Path $_.FullName -Pattern 'icu' -SimpleMatch |
                ForEach-Object { Write-Host $_.Line }
            }
          Get-ChildItem -Path .tools/qt/6.12.0 -Recurse -Include '*.lib', '*.a' |
            ForEach-Object {
              $file = $_
              $hit = Select-String -Path $file.FullName -Pattern 'ucnv_open' -SimpleMatch -List
              if ($hit) { Write-Host "ICU-SYMBOL: $($file.FullName)" }
            }
