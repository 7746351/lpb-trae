name: Windows Offline Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: windows-offline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-offline:
    name: Build Snow Shot offline x64
    runs-on: windows-2025-vs2026
    timeout-minutes: 350

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Report runner resources
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,
              @{ n = 'FreeGB'; e = { [math]::Round($_.Free / 1GB, 1) } },
              @{ n = 'UsedGB'; e = { [math]::Round($_.Used / 1GB, 1) } } |
            Format-Table -AutoSize | Out-String | Write-Host

      - name: Install packaging tools
        shell: pwsh
        run: |
          choco install nsis nasm -y --no-progress

      - name: Pin Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .tools/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**') }}-v1

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          .\scripts\bootstrap.ps1 -Preset snow-shot-msvc-offline-release -SkipQtValidation

      - name: Save vcpkg cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .tools/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**') }}-v1

      - name: Restore static Qt cache
        id: qt-cache
        uses: actions/cache/restore@v4
        with:
          path: .tools/qt/6.12.0
          key: qt-${{ runner.os }}-${{ hashFiles('scripts/qt-toolchain.json') }}-static-v1

      - name: Build static Qt 6.12.0
        shell: pwsh
        run: |
          .\scripts\build-static-qt.ps1 `
            -InstallPrefix .tools/qt/6.12.0/msvc2026_64-static-system-codecs `
            -Parallelism 4

      - name: Save static Qt cache
        if: always() && steps.qt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .tools/qt/6.12.0
          key: qt-${{ runner.os }}-${{ hashFiles('scripts/qt-toolchain.json') }}-static-v1

      - name: Warm Cargo dependency cache
        shell: pwsh
        run: |
          $pin = Get-Content 'snow-crates/crates/simd-paddle-ocr-rs/rust-toolchain.toml' -Raw
          if ($pin -notmatch 'channel\s*=\s*"([^"]+)"') { throw 'Invalid OCR toolchain pin.' }
          $ocr = $Matches[1]
          cargo "+$ocr" fetch --manifest-path 'snow-crates/crates/snow-ocr-process/Cargo.toml'
          foreach ($manifest in @(
            'snow-crates/Cargo.toml',
            'snow_rust_ffi/Cargo.toml',
            'snow_shot/rust/snow-shot-mcp/Cargo.toml',
            'snow_shot/rust/snow-shot-updater/Cargo.toml'
          )) {
            cargo fetch --manifest-path $manifest
          }

      - name: Build Snow Shot offline release
        shell: pwsh
        run: |
          .\scripts\build.ps1 -Preset snow-shot-msvc-offline-release

      - name: Package offline installer
        shell: pwsh
        run: |
          .\scripts\package-snow-shot.ps1 -Offline -Architecture x64 -SkipBuild -Parallelism 4

      - name: Smoke test packaged binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'artifacts/snow-shot'
          $exe = Join-Path $stage 'bin/snow_shot.exe'
          $updater = Join-Path $stage 'bin/snow-shot-updater.exe'
          foreach ($path in @($exe, $updater)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing staged binary: $path" }
          }

          $probe = Start-Process -FilePath $exe -ArgumentList '--update-probe', '1.6.3' -PassThru -WindowStyle Hidden
          if (-not $probe.WaitForExit(60000)) { $probe.Kill(); throw 'Update probe timed out.' }
          if ($probe.ExitCode -ne 0) { throw "Update probe failed with exit code $($probe.ExitCode)." }
          Write-Host 'Update probe passed.'

          $tx = Start-Process -FilePath $updater -ArgumentList '--transaction-state', '--target', "`"$stage`"" -PassThru -WindowStyle Hidden
          if (-not $tx.WaitForExit(60000)) { $tx.Kill(); throw 'Updater transaction probe timed out.' }
          if ($tx.ExitCode -ne 0) { throw "Updater transaction probe failed with exit code $($tx.ExitCode)." }
          Write-Host 'Updater transaction probe passed.'

          $env:QT_QPA_PLATFORM = 'offscreen'
          $out = Join-Path $env:RUNNER_TEMP 'smoke-stdout.txt'
          $err = Join-Path $env:RUNNER_TEMP 'smoke-stderr.txt'
          $gui = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 25
          if ($gui.HasExited) {
            Write-Host '--- stdout ---'
            Get-Content -LiteralPath $out -ErrorAction SilentlyContinue
            Write-Host '--- stderr ---'
            Get-Content -LiteralPath $err -ErrorAction SilentlyContinue
            throw "GUI smoke test failed: process exited early with code $($gui.ExitCode)."
          }
          Write-Host 'GUI smoke test passed: application stayed alive for 25 seconds.'
          if (-not $gui.HasExited) { $gui.Kill(); }

      - name: List packages
        if: always()
        shell: pwsh
        run: |
          $output = 'build\snow-shot-msvc-offline-release'
          if (Test-Path -LiteralPath $output -PathType Container) {
            Get-ChildItem -LiteralPath $output -Filter 'snow-shot-*' -File |
              Select-Object Name, Length |
              Format-Table -AutoSize | Out-String | Write-Host
          } else {
            Write-Host "No package output directory yet: $output"
          }

      - name: Upload offline packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-offline-windows-x64
          if-no-files-found: warn
          path: |
            build/snow-shot-msvc-offline-release/*.exe
            build/snow-shot-msvc-offline-release/*.zip
            build/snow-shot-msvc-offline-release/*.sha256
            build/snow-shot-msvc-offline-release/*.manifest.json
